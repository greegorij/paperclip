name: PR

on:
  pull_request:
    # Explicit types: GitHub's default omits ready_for_review / labeled /
    # unlabeled / converted_to_draft, which would skip the final full track
    # and ci:full label-driven re-runs.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
    branches:
      - master
      - production

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lockfile_regenerated: ${{ steps.regen_lockfile.outputs.regenerated }}
      mode: ${{ steps.classify.outputs.mode }}
      reason: ${{ steps.classify.outputs.reason }}
      run_core: ${{ steps.classify.outputs.run_core }}
      run_server: ${{ steps.classify.outputs.run_server }}
      run_workspaces: ${{ steps.classify.outputs.run_workspaces }}
      run_ui: ${{ steps.classify.outputs.run_ui }}
      run_packages: ${{ steps.classify.outputs.run_packages }}
      run_cli: ${{ steps.classify.outputs.run_cli }}
      run_build: ${{ steps.classify.outputs.run_build }}
      run_e2e: ${{ steps.classify.outputs.run_e2e }}
      run_canary: ${{ steps.classify.outputs.run_canary }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Block manual lockfile edits
        if: >-
          github.head_ref != 'chore/refresh-lockfile' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          # Diff the PR branch against its merge base so recent base-branch commits
          # do not masquerade as changes made by the PR itself.
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          if printf '%s\n' "$changed" | grep -qx 'pnpm-lock.yaml'; then
            echo "Do not commit pnpm-lock.yaml in pull requests. CI owns lockfile updates."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate Dockerfile deps stage
        run: node ./scripts/check-docker-deps-stage.mjs

      - name: Reject git push in adapter/runtime code
        run: node ./scripts/check-no-git-push.mjs

      - name: Test no-git-push check
        run: node --test ./scripts/check-no-git-push.test.mjs

      - name: Test general-server shard partition
        run: node --test ./scripts/__tests__/run-vitest-stable-shard.test.mjs

      - name: Test e2e shard partition
        run: node --test ./scripts/__tests__/e2e-shard.test.mjs

      - name: Test production bootstrap policy
        run: node --test ./scripts/__tests__/production-bootstrap-policy.test.mjs

      - name: Test release verify workflow wiring
        run: node --test ./scripts/__tests__/release-verify-workflow.test.mjs

      - name: Test standalone package build concurrency
        run: node --test ./scripts/__tests__/build-standalone-concurrency.test.mjs

      - name: Test PR CI cost classifier
        run: node --test ./scripts/__tests__/classify-pr-ci.test.mjs

      - name: Validate release package manifest
        run: node ./scripts/release-package-map.mjs check

      - name: Verify release package bootstrap for changed manifests
        run: |
          mapfile -t changed_paths < <(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          PAPERCLIP_RELEASE_BOOTSTRAP_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            node ./scripts/check-release-package-bootstrap.mjs "${changed_paths[@]}"

      - name: Classify PR CI track
        id: classify
        env:
          # Collect labels as newline-separated names for the classifier CLI.
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, '\n') }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          mapfile -t changed_paths < <(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          label_args=()
          while IFS= read -r label; do
            [ -n "$label" ] || continue
            label_args+=(--label "$label")
          done <<< "$PR_LABELS"
          path_args=()
          for p in "${changed_paths[@]}"; do
            path_args+=(--path "$p")
          done
          node ./scripts/classify-pr-ci.mjs classify \
            --draft "$PR_DRAFT" \
            "${label_args[@]}" \
            "${path_args[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate dependency resolution when manifests change
        id: regen_lockfile
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          manifest_pattern='(^|/)package\.json$|^pnpm-workspace\.yaml$|^\.npmrc$|^pnpmfile\.(cjs|js|mjs)$|^patches/'
          if printf '%s\n' "$changed" | grep -Eq "$manifest_pattern"; then
            pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
            echo "regenerated=1" >> "$GITHUB_OUTPUT"
          else
            echo "regenerated=0" >> "$GITHUB_OUTPUT"
          fi

      # Manifest-only PRs (where pnpm-lock.yaml stays at base because the policy
      # job above blocks committing it) need the regenerated lockfile for the
      # downstream `pnpm install --frozen-lockfile` steps. Upload it here so
      # every job consumes the same hash without recomputing.
      - name: Upload regenerated lockfile for downstream jobs
        if: steps.regen_lockfile.outputs.regenerated == '1'
        uses: actions/upload-artifact@v7
        with:
          name: pr-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
          if-no-files-found: error

  # One install: selective server typecheck + general-server shards 0..2 of 3,
  # run sequentially on one runner (canonical release-verify partition; avoids
  # unsharded hangs and preserves isolation without a 3-runner matrix).
  verify_server_general:
    name: Verify server general (typecheck + shards)
    needs: [policy]
    if: ${{ needs.policy.result == 'success' && needs.policy.outputs.run_server == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate server lane flags (fail-closed)
        env:
          CI_MODE: ${{ needs.policy.outputs.mode }}
          RUN_SERVER: ${{ needs.policy.outputs.run_server }}
        run: |
          node ./scripts/classify-pr-ci.mjs check-server-lanes \
            --mode "$CI_MODE" \
            --run-server "$RUN_SERVER"

      - name: Typecheck server (selective)
        if: needs.policy.outputs.mode == 'selective'
        run: pnpm --filter @paperclipai/server typecheck

      - name: Run general-server shards sequentially
        run: |
          for shard_index in 0 1 2; do
            echo "::group::general-server shard $((shard_index + 1))/3"
            pnpm test:run:general -- --group general-server \
              --shard-index "$shard_index" --shard-count 3
            echo "::endgroup::"
          done

  # One install: serialized shards 0..3 of 4, sequential on one runner
  # (same canonical partition as release-verify.yml).
  verify_server_serialized:
    name: Verify server serialized (shards)
    needs: [policy]
    if: ${{ needs.policy.result == 'success' && needs.policy.outputs.run_server == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate server lane flags (fail-closed)
        env:
          CI_MODE: ${{ needs.policy.outputs.mode }}
          RUN_SERVER: ${{ needs.policy.outputs.run_server }}
        run: |
          node ./scripts/classify-pr-ci.mjs check-server-lanes \
            --mode "$CI_MODE" \
            --run-server "$RUN_SERVER"

      - name: Run serialized server shards sequentially
        run: |
          for shard_index in 0 1 2 3; do
            echo "::group::serialized shard $((shard_index + 1))/4"
            pnpm test:run:serialized -- \
              --shard-index "$shard_index" --shard-count 4
            echo "::endgroup::"
          done

  # One install: build-gap typechecks + release-registry + workspace groups.
  # Full track runs the historical non-server core surface. Selective draft
  # tracks start this job only for ui / packages / cli sub-lanes.
  verify_workspaces:
    name: Verify workspaces (typecheck + unit)
    needs: [policy]
    if: ${{ needs.policy.result == 'success' && needs.policy.outputs.run_workspaces == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspaces sub-lane flags (fail-closed)
        env:
          CI_MODE: ${{ needs.policy.outputs.mode }}
          RUN_UI: ${{ needs.policy.outputs.run_ui }}
          RUN_PACKAGES: ${{ needs.policy.outputs.run_packages }}
          RUN_CLI: ${{ needs.policy.outputs.run_cli }}
        run: |
          node ./scripts/classify-pr-ci.mjs check-workspaces-lanes \
            --mode "$CI_MODE" \
            --run-ui "$RUN_UI" \
            --run-packages "$RUN_PACKAGES" \
            --run-cli "$RUN_CLI"

      - name: Typecheck workspaces whose build scripts skip TypeScript
        if: needs.policy.outputs.mode == 'full'
        run: pnpm run typecheck:build-gaps

      - name: Verify release registry test coverage
        if: needs.policy.outputs.mode == 'full'
        run: pnpm run test:release-registry

      - name: Typecheck UI (selective)
        if: needs.policy.outputs.mode == 'selective' && needs.policy.outputs.run_ui == '1'
        run: pnpm --filter @paperclipai/ui typecheck

      - name: Typecheck packages (selective)
        if: needs.policy.outputs.mode == 'selective' && needs.policy.outputs.run_packages == '1'
        run: pnpm --filter "./packages/**" typecheck

      - name: Typecheck CLI (selective)
        if: needs.policy.outputs.mode == 'selective' && needs.policy.outputs.run_cli == '1'
        run: pnpm --filter paperclipai typecheck

      - name: Run general-workspaces-a suites (ui + cli projects)
        if: >-
          needs.policy.outputs.mode == 'full' ||
          needs.policy.outputs.run_ui == '1' ||
          needs.policy.outputs.run_cli == '1'
        run: pnpm test:run:general -- --group general-workspaces-a

      - name: Run general-workspaces-b suites (packages projects)
        if: needs.policy.outputs.mode == 'full' || needs.policy.outputs.run_packages == '1'
        run: pnpm test:run:general -- --group general-workspaces-b

  # One install: either plain `pnpm build` or canary dry-run (which builds
  # internally via release.sh Step 2/7). Never both — that would double-build
  # on the full track where run_canary=1.
  verify_build:
    name: Verify build
    needs: [policy]
    if: ${{ needs.policy.result == 'success' && needs.policy.outputs.run_build == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Skipped when canary dry-run runs: release.sh already executes `pnpm build`.
      - name: Build
        if: needs.policy.outputs.run_canary != '1'
        run: pnpm build

      - name: Release canary dry run via release.sh internal build
        if: needs.policy.outputs.run_canary == '1'
        env:
          USED_ARTIFACT_LOCKFILE: ${{ needs.policy.outputs.lockfile_regenerated || '0' }}
        run: |
          # `release.sh` always executes its Step 2/7 workspace build, even when
          # `--skip-verify` bypasses the initial verification gate. release.sh
          # also requires a clean working tree, so any in-place lockfile churn
          # from `pnpm install --frozen-lockfile` must be reverted first — unless
          # the policy job uploaded a regenerated lockfile (manifest-changing
          # PRs), in which case we stage the artifact-restored copy into an
          # ephemeral local commit so release.sh sees a clean tree and its
          # workspace build sees a lockfile that matches the manifest.
          git checkout -B master HEAD
          if [ "$USED_ARTIFACT_LOCKFILE" = "1" ]; then
            git add pnpm-lock.yaml
            if ! git diff --cached --quiet; then
              git -c user.email=ci@paperclip.local -c user.name=CI \
                commit --no-verify -m "ci(canary): stage regenerated lockfile"
            fi
          else
            git checkout -- pnpm-lock.yaml
          fi
          ./scripts/release.sh canary --skip-verify --dry-run

  e2e_shards:
    name: e2e shard (${{ matrix.shard_label }})
    needs: [policy]
    # Intentionally omitted on docs/selective tracks that do not need e2e.
    # The legacy `e2e` aggregate accepts skipped when run_e2e=0.
    if: ${{ needs.policy.result == 'success' && needs.policy.outputs.run_e2e == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_count: 2
            shard_label: "1/2"
          - shard_index: 1
            shard_count: 2
            shard_label: "2/2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runner Chrome
        # GitHub's Ubuntu runner image already ships Google Chrome, so use that
        # directly for the headless e2e lane instead of downloading Playwright
        # browser bundles inside the 30 minute job budget.
        run: google-chrome --version

      - name: Generate Paperclip config
        run: |
          mkdir -p ~/.paperclip/instances/default
          cat > ~/.paperclip/instances/default/config.json << 'CONF'
          {
            "$meta": { "version": 1, "updatedAt": "2026-01-01T00:00:00.000Z", "source": "onboard" },
            "database": { "mode": "embedded-postgres" },
            "logging": { "mode": "file" },
            "server": { "deploymentMode": "local_trusted", "host": "127.0.0.1", "port": 3100 },
            "auth": { "baseUrlMode": "auto" },
            "storage": { "provider": "local_disk" },
            "secrets": { "provider": "local_encrypted", "strictMode": false }
          }
          CONF

      - name: Run e2e tests
        env:
          PAPERCLIP_E2E_SKIP_LLM: "true"
          PAPERCLIP_PLAYWRIGHT_CHANNEL: "chrome"
        run: |
          # Playwright's own --shard balances by test count, and one spec
          # (smoke-lab) is ~40% of the lane's wall clock. Partition by recorded
          # spec duration instead so both runners finish together.
          specs="$(node ./scripts/e2e-shard.mjs \
            --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }})"
          echo "shard ${{ matrix.shard_label }} specs: $specs"
          # Do not insert an extra `--` before $specs. pnpm 9.15.4 forwards a
          # literal `--` into Playwright's argv, and Playwright then treats it
          # as a test filter that matches everything — both shards would run
          # the full suite (including smoke-lab) instead of the computed list.
          pnpm run test:e2e $specs

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard_index }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14

  verify:
    # Preserve the legacy required-check name. Authoritative aggregate over the
    # consolidated critical lanes; intentional omissions (docs/selective) are
    # accepted as skipped via classify-pr-ci check-verify.
    name: verify
    if: ${{ always() }}
    needs:
      - policy
      - verify_server_general
      - verify_server_serialized
      - verify_workspaces
      - verify_build
      - e2e_shards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fail if any required verify lane failed
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          RUN_SERVER: ${{ needs.policy.outputs.run_server }}
          RUN_WORKSPACES: ${{ needs.policy.outputs.run_workspaces }}
          RUN_BUILD: ${{ needs.policy.outputs.run_build }}
          RUN_E2E: ${{ needs.policy.outputs.run_e2e }}
          SERVER_GENERAL_RESULT: ${{ needs.verify_server_general.result }}
          SERVER_SERIALIZED_RESULT: ${{ needs.verify_server_serialized.result }}
          WORKSPACES_RESULT: ${{ needs.verify_workspaces.result }}
          BUILD_RESULT: ${{ needs.verify_build.result }}
          E2E_SHARDS_RESULT: ${{ needs.e2e_shards.result }}
          CI_MODE: ${{ needs.policy.outputs.mode }}
          CI_REASON: ${{ needs.policy.outputs.reason }}
        run: |
          echo "CI track: ${CI_MODE}"
          echo "Reason: ${CI_REASON}"
          test "$POLICY_RESULT" = "success"
          node ./scripts/classify-pr-ci.mjs check-verify \
            --run-server "$RUN_SERVER" \
            --run-workspaces "$RUN_WORKSPACES" \
            --run-build "$RUN_BUILD" \
            --run-e2e "$RUN_E2E" \
            --server-general-result "$SERVER_GENERAL_RESULT" \
            --server-serialized-result "$SERVER_SERIALIZED_RESULT" \
            --workspaces-result "$WORKSPACES_RESULT" \
            --build-result "$BUILD_RESULT" \
            --e2e-result "$E2E_SHARDS_RESULT"

  e2e:
    # Preserve the legacy required-check name while the specs run sharded
    # across the matrix above (same pattern as the `verify` aggregate).
    name: e2e
    if: ${{ always() }}
    needs:
      - policy
      - e2e_shards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fail if e2e was required and failed
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          RUN_E2E: ${{ needs.policy.outputs.run_e2e }}
          E2E_SHARDS_RESULT: ${{ needs.e2e_shards.result }}
          CI_MODE: ${{ needs.policy.outputs.mode }}
          CI_REASON: ${{ needs.policy.outputs.reason }}
        run: |
          echo "CI track: ${CI_MODE}"
          echo "Reason: ${CI_REASON}"
          test "$POLICY_RESULT" = "success"
          node ./scripts/classify-pr-ci.mjs check-e2e \
            --run-e2e "$RUN_E2E" \
            --result "$E2E_SHARDS_RESULT"
