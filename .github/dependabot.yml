version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # limit: 0 disables routine version-update PRs on this production layer;
    # dependencies flow in through upstream sync instead. Dependabot security
    # alerts and automatic security-fix PRs are governed separately in repo
    # Settings → Code security — they may still open PRs when a vulnerability
    # is detected, regardless of this limit.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    ignore:
      # Ignore major version bumps — review those manually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # limit: 0 disables routine version-update PRs on this production layer;
    # dependencies flow in through upstream sync instead. Dependabot security
    # alerts and automatic security-fix PRs are governed separately in repo
    # Settings → Code security — they may still open PRs when a vulnerability
    # is detected, regardless of this limit.
    open-pull-requests-limit: 0
