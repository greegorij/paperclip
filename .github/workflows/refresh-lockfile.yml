name: Refresh Lockfile

on:
  push:
    branches:
      - master
      - production
  workflow_dispatch:

concurrency:
  # Keep master and production refreshes isolated so one target cannot cancel
  # or overwrite the other's bot branch / PR upsert.
  group: refresh-lockfile-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Refresh pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Fail on unexpected file changes
        run: |
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi

      - name: Create or update pull request
        id: upsert-pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged, nothing to do."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Predictable bot branch per target: master keeps the historical
          # name; every other target (production, …) gets a suffix.
          if [ "$TARGET_BRANCH" = "master" ]; then
            BRANCH="chore/refresh-lockfile"
          else
            BRANCH="chore/refresh-lockfile-${TARGET_BRANCH}"
          fi

          git config user.name "lockfile-bot"
          git config user.email "lockfile-bot@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): refresh pnpm-lock.yaml on ${TARGET_BRANCH}"
          git push --force origin "$BRANCH"

          # Only reuse an open PR from this repository owner for this exact
          # head→base pair — never a fork with the same branch name, and never
          # a PR aimed at a different target branch.
          pr_url="$(
            gh pr list --state open --head "$BRANCH" --base "$TARGET_BRANCH" \
              --json url,headRepositoryOwner \
              --jq ".[] | select(.headRepositoryOwner.login == \"$REPO_OWNER\") | .url" |
            head -n 1
          )"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --head "$BRANCH" \
              --base "$TARGET_BRANCH" \
              --title "chore(lockfile): refresh pnpm-lock.yaml (${TARGET_BRANCH})" \
              --body "Auto-generated lockfile refresh after dependencies changed on \`${TARGET_BRANCH}\`. This PR only updates pnpm-lock.yaml.")"
            echo "Created new PR: $pr_url"
          else
            echo "PR already exists: $pr_url"
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for lockfile PR
        if: steps.upsert-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --auto --squash --delete-branch "${{ steps.upsert-pr.outputs.pr_url }}"
